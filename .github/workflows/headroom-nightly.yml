name: Headroom

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    name: full sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Full headroom sweep
        run: npm run test:headroom

      - name: Re-render the worst cases the push job checks
        env:
          HEADROOM_CHECK_RESULT: ${{ github.workspace }}/headroom-check-result.txt
        run: npm run test:headroom-check

      - name: Open a pull request when worst cases change
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEADROOM_CHECK_RESULT: ${{ github.workspace }}/headroom-check-result.txt
        run: |
          branch="bot/headroom-worst-${GITHUB_RUN_ID}"
          case "$branch" in
            main|master|refs/heads/main|refs/heads/master)
              echo "refusing to push ${branch}"
              exit 1
              ;;
          esac
          if [ ! -s "$HEADROOM_CHECK_RESULT" ]; then
            echo 'the render check did not record a result'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add tests/fixtures/headroom-worst.json
          if git diff --cached --quiet; then
            echo 'worst cases unchanged'
            exit 0
          fi
          git commit -m "chore: refresh headroom worst cases"
          git push origin "refs/heads/${branch}:refs/heads/${branch}"
          result=$(cat "$HEADROOM_CHECK_RESULT")
          body=$(cat <<EOF
          The nightly headroom sweep refreshed tests/fixtures/headroom-worst.json.

          The per-push render check ran against that file before this pull request was opened. A pull request opened with GITHUB_TOKEN does not trigger CI.

          Result:
          ${result}

          This pull request is opened from bot branch ${branch}. The workflow does not push to main.

          The repository setting "Allow GitHub Actions to create and approve pull requests" must be on for this step. That setting is pending Jonny's OK.
          EOF
          )
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh headroom worst cases" \
            --body "$body"
