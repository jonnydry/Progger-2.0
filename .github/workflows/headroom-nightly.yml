name: Headroom

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# One night at a time. A second run waits; it does not cancel a sweep
# that is already rendering.
concurrency:
  group: headroom-worst
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: full sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      fixture: ${{ steps.publish.outputs.fixture }}
      result: ${{ steps.publish.outputs.result }}
      sha: ${{ steps.publish.outputs.sha }}
      check: ${{ steps.publish.outputs.check }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Full headroom sweep
        run: npm run test:headroom

      - name: Re-render the worst cases the push job checks
        id: render
        continue-on-error: true
        env:
          HEADROOM_CHECK_RESULT: ${{ github.workspace }}/headroom-check-result.txt
        run: npm run test:headroom-check

      - name: Record the sweep result
        id: publish
        env:
          HEADROOM_CHECK_RESULT: ${{ github.workspace }}/headroom-check-result.txt
          CHECK_OUTCOME: ${{ steps.render.outcome }}
        run: |
          if [ "$CHECK_OUTCOME" != "success" ]; then
            echo 'check=failure' >> "$GITHUB_OUTPUT"
            if [ ! -s "$HEADROOM_CHECK_RESULT" ]; then
              printf '%s\n' 'the per-push render check failed before it recorded a result' > "$HEADROOM_CHECK_RESULT"
            else
              printf '%s\n' 'the per-push render check failed' >> "$HEADROOM_CHECK_RESULT"
            fi
          else
            if [ ! -s "$HEADROOM_CHECK_RESULT" ]; then
              echo 'the render check did not record a result'
              exit 1
            fi
            echo 'check=success' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          delimiter="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          while grep -Fqx "$delimiter" "$HEADROOM_CHECK_RESULT"; do
            delimiter="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          done
          {
            echo "result<<${delimiter}"
            cat "$HEADROOM_CHECK_RESULT"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          if git diff --quiet -- tests/fixtures/headroom-worst.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'worst cases unchanged'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "fixture=$(base64 -w 0 tests/fixtures/headroom-worst.json)" >> "$GITHUB_OUTPUT"

      # Outputs are already recorded. Failing here keeps the nightly red
      # when the re-render fails, including when the fixture did not change
      # and there is no new commit to mark.
      - name: Fail the sweep when the render check failed
        if: steps.publish.outputs.check == 'failure'
        run: |
          echo 'the per-push render check failed'
          exit 1

  pull-request:
    name: update bot pull request
    needs: sweep
    if: always() && needs.sweep.outputs.changed == 'true' && needs.sweep.outputs.fixture != '' && needs.sweep.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sweep.outputs.sha }}

      - name: Commit and push the bot branch
        id: commit
        env:
          FIXTURE: ${{ needs.sweep.outputs.fixture }}
        run: |
          branch="bot/headroom-worst"
          if [ "$branch" != "bot/headroom-worst" ]; then
            echo "refusing to push ${branch}"
            exit 1
          fi
          case "$branch" in
            main|master|refs/heads/main|refs/heads/master)
              echo "refusing to push ${branch}"
              exit 1
              ;;
          esac
          printf '%s' "$FIXTURE" | base64 -d > tests/fixtures/headroom-worst.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add tests/fixtures/headroom-worst.json
          if git diff --cached --quiet; then
            echo 'worst cases unchanged'
            exit 0
          fi
          git commit -m "chore: refresh headroom worst cases"
          # SHA of the commit this step just created. The status step uses
          # this value. It does not use github.sha or look up the branch tip.
          commit_sha=$(git rev-parse HEAD)
          git push --force origin "HEAD:refs/heads/bot/headroom-worst"
          echo "sha=${commit_sha}" >> "$GITHUB_OUTPUT"

      # always() so a failed re-render still posts. The only gate is the SHA
      # written above, which exists only after this run's push succeeded.
      - name: Post the nightly commit status
        id: status
        if: always() && steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          CHECK: ${{ needs.sweep.outputs.check }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SHA" ]; then
            echo 'missing the pushed commit sha'
            exit 1
          fi
          if [ "$CHECK" = "success" ]; then
            state=success
            description='Nightly per-push headroom check passed'
          else
            state=failure
            description='Nightly per-push headroom check failed'
          fi
          posted=0
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
              -f state="$state" \
              -f target_url="$RUN_URL" \
              -f description="$description" \
              -f context='headroom/nightly-verified'
            then
              posted=1
              break
            fi
            echo "status post attempt ${attempt} did not land"
            attempt=$((attempt + 1))
            sleep 2
          done
          if [ "$posted" != 1 ]; then
            echo 'could not post the commit status'
            exit 1
          fi
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Open or update the bot pull request
        if: success() && steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.sweep.outputs.result }}
          SHA: ${{ steps.commit.outputs.sha }}
          STATE: ${{ steps.status.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESULT" ]; then
            echo 'the render check did not record a result'
            exit 1
          fi
          if [ "$STATE" = "success" ]; then
            title="chore: refresh headroom worst cases"
          else
            title="chore: headroom check failed"
          fi
          result="$RESULT"
          body=$(cat <<EOF
          The nightly headroom sweep refreshed tests/fixtures/headroom-worst.json.

          The per-push render check ran against that file before this pull request was opened or updated. A pull request opened with GITHUB_TOKEN does not trigger CI.

          The nightly run posted commit status headroom/nightly-verified (${STATE}) on ${SHA}:
          ${RUN_URL}

          Result:
          ${result}

          This pull request tracks bot branch bot/headroom-worst. Each night force-updates that branch only. The workflow does not push to main or to any human branch.
          EOF
          )
          number=$(gh pr list --head "bot/headroom-worst" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body" --title "$title"
          else
            gh pr create \
              --base main \
              --head "bot/headroom-worst" \
              --title "$title" \
              --body "$body"
          fi
