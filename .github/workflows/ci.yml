name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phrase
          POSTGRES_PASSWORD: phrase
          POSTGRES_DB: phrase_plan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phrase -d phrase_plan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: ["postgres", "-c", "max_connections=400"]
    env:
      PG_TEST_URL: postgres://phrase:phrase@localhost:5432/phrase_plan
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build:vercel

      - name: tray export
        run: node scripts/check-tray-export.mjs
