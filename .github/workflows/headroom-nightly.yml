name: Headroom

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sweep:
    name: full sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Full headroom sweep
        run: npm run test:headroom

      - name: Upload worst cases
        uses: actions/upload-artifact@v7
        with:
          name: headroom-worst
          path: tests/fixtures/headroom-worst.json
          if-no-files-found: error

      - name: Open a pull request when worst cases change
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bot/headroom-worst-${GITHUB_RUN_ID}"
          case "$branch" in
            main|master|refs/heads/main|refs/heads/master)
              echo "refusing to push ${branch}"
              exit 1
              ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add tests/fixtures/headroom-worst.json
          if git diff --cached --quiet; then
            echo 'worst cases unchanged'
            exit 0
          fi
          git commit -m "chore: refresh headroom worst cases"
          git push origin "refs/heads/${branch}:refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh headroom worst cases" \
            --body "The nightly headroom sweep refreshed tests/fixtures/headroom-worst.json. This pull request is opened from a bot branch. The workflow does not push to main."
